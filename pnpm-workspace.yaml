packages:
  - apps/*
  - packages/*

hoistPattern:
  - '@prisma/client'
  - '@prisma/*'

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  puppeteer: true
  tesseract.js: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - framer-motion@14.3.1
  - motion-dom@14.3.1
  - openai@7.39.0