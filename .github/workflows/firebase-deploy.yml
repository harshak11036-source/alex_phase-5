name: Firebase Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      project_id:
        description: 'Firebase Project ID (optional, uses default from .firebaserc)'
        required: false
        type: string

  push:
    branches: [main]
    # Only trigger on main branch pushes for production

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate firebase.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          echo "✅ firebase.json syntax valid"

      - name: Validate Firestore rules
        run: |
          head -1 firebase/firestore.rules | grep -q "rules_version = '2'"
          echo "✅ Firestore rules version valid"

      - name: Validate Storage rules
        run: |
          head -1 firebase/storage.rules | grep -q "rules_version = '2'"
          echo "✅ Storage rules version valid"

      - name: Check required files
        run: |
          test -f firebase/firestore.rules
          test -f firebase/storage.rules
          test -f firebase/firestore.indexes.json
          test -f .firebaserc
          echo "✅ All Firebase config files present"

      - name: Check for committed secrets
        run: |
          if grep -r "sk-\|nvapi-\|AIza\|ya29\." --include="*.ts" --include="*.js" --include="*.json" apps/ functions/ 2>/dev/null | grep -v ".example" | grep -v "node_modules"; then
            echo "❌ Potential API keys found in source code"
            exit 1
          fi
          echo "✅ No obvious secrets in source code"

  build:
    name: Build Application
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter apps/web run db:generate

      - name: Build shared packages
        run: |
          pnpm --filter @alex/shared-types run build
          pnpm --filter @alex/shared-utils run build
          pnpm --filter @alex/validation-schemas run build

      - name: Build web application
        run: pnpm --filter apps/web run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.environment == 'production' && format('https://{0}.web.app', secrets.FIREBASE_PROJECT_ID) || format('https://{0}--preview.web.app', secrets.FIREBASE_PROJECT_ID) }}

      - name: Build Firebase Functions
        run: pnpm --filter functions run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/out/
          retention-days: 1

      - name: Upload functions build
        uses: actions/upload-artifact@v4
        with:
          name: functions-build
          path: functions/lib/
          retention-days: 1

  deploy-firestore:
    name: Deploy Firestore Rules & Indexes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/out/

      - name: Setup Firebase
        uses: firebase/action@master
        with:
          projectId: ${{ github.event.inputs.project_id || secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-storage:
    name: Deploy Storage Rules
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Firebase
        uses: firebase/action@master
        with:
          projectId: ${{ github.event.inputs.project_id || secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Storage Rules
        run: firebase deploy --only storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-functions:
    name: Deploy Firebase Functions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download functions build
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: functions/lib/

      - name: Setup Firebase
        uses: firebase/action@master
        with:
          projectId: ${{ github.event.inputs.project_id || secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Functions
        run: firebase deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-hosting:
    name: Deploy Firebase Hosting
    needs: [build, deploy-firestore, deploy-storage, deploy-functions]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/out/

      - name: Setup Firebase
        uses: firebase/action@master
        with:
          projectId: ${{ github.event.inputs.project_id || secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy to Preview Channel
        if: github.event.inputs.environment == 'preview' || github.event_name == 'pull_request'
        run: |
          CHANNEL_NAME=${{ github.event.inputs.environment == 'preview' && 'preview' || format('pr-{0}', github.event.number) }}
          firebase hosting:channel:deploy $CHANNEL_NAME --expires 7d
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Production
        if: github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main'
        run: firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Notify Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const env = '${{ github.event.inputs.environment || "preview" }}';
            const projectId = '${{ secrets.FIREBASE_PROJECT_ID }}';
            let url = '';
            if (env === 'production') {
              url = `https://${projectId}.web.app`;
            } else {
              url = `https://${projectId}--preview.web.app`;
            }
            const body = `## 🚀 Deployment ${status === 'success' ? 'Succeeded' : 'Failed'}\n\nEnvironment: ${env}\nProject: ${projectId}\n${status === 'success' ? `URL: ${url}` : ''}\n\nCheck workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            if (github.context.eventName === 'workflow_dispatch') {
              // For manual triggers, create an issue or use another notification method
              console.log(body);
            } else if (github.context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }